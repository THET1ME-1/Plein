name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Красный тест выпуск останавливает: телефона под рукой нет, снимки
      # экрана считаются на JVM и служат единственной проверкой вида.
      - name: Тесты и снимки экрана
        run: ./gradlew testDebugUnitTest verifyRoborazziDebug

      - name: Ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Секрет KEYSTORE_BASE64 не задан"
            exit 1
          fi
          mkdir -p ~/keys
          echo "$KEYSTORE_BASE64" | base64 -d > ~/keys/plein.jks
          cat > ~/keys/plein.properties <<EOF
          storeFile=$HOME/keys/plein.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Сборка
        run: ./gradlew assembleRelease

      # Имена по правилу: Plein-версия-abi.apk
      - name: Имена файлов
        id: rename
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ -z "$VERSION" ] && VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p out
          for apk in app/build/outputs/apk/release/*.apk; do
            name=$(basename "$apk")
            abi=$(echo "$name" | sed -E 's/^app-(.*)-release.*\.apk$/\1/')
            case "$abi" in
              "$name"|release) abi=universal ;;
            esac
            cp "$apk" "out/Plein-${VERSION}-${abi}.apk"
          done
          ls -lh out
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Публикация
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Plein ${{ steps.rename.outputs.version }}
          generate_release_notes: true
          files: out/*.apk
